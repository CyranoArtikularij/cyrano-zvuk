<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drugi svijet: Komična priča o kraljevstvima i pokrajinama Mjeseca — zvučni zapisi</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Georgia,'Times New Roman',serif}main{max-width:600px;margin:0 auto;padding:64px 24px 80px}header{text-align:center;margin-bottom:38px}h1{font-size:clamp(32px,7vw,47px);font-weight:400;line-height:1.15;margin:0 0 15px}header p{font-size:15px;line-height:1.6;margin:0}.rule{height:1px;background:#111;margin:34px 0 0}.item{border-bottom:1px solid #111;padding:26px 0 30px}.item-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:16px}.number{font-size:19px;font-variant-numeric:lining-nums tabular-nums}.notation{display:block;width:100%;height:auto;max-height:180px;object-fit:contain;object-position:center;background:white}button{font-family:inherit;background:white;color:#111;border:1px solid #111;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;display:grid;place-items:center}button svg{width:19px;height:19px;display:block;fill:currentColor}button:hover,button:focus-visible{background:#111;color:#fff}button:focus-visible{outline:2px solid #111;outline-offset:3px}footer{text-align:center;font-size:12px;margin-top:48px;line-height:1.5;color:#555}@media(max-width:420px){main{padding:40px 17px 60px}.item{padding:20px 0 25px}.notation{max-height:135px}}
</style>
</head>
<body>
<main>
<header><h1>Drugi svijet: Komična priča o kraljevstvima i pokrajinama Mjeseca</h1><p>Dodirnite simbol za slušanje pojedinog zapisa.</p><div class="rule"></div></header>
<section aria-label="Zvučni zapisi">
<div class="item"><div class="item-top"><span class="number">01</span><button type="button" aria-label="Reproduciraj zapis 01" data-file="Cyrano_01.wav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg></button></div><img class="notation" src="Cyrano-01.png" alt="Vizualni prikaz zvučnog zapisa 01" loading="lazy"></div>
<div class="item"><div class="item-top"><span class="number">02</span><button type="button" aria-label="Reproduciraj zapis 02" data-file="Cyrano_02.wav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg></button></div><img class="notation" src="Cyrano-02.png" alt="Vizualni prikaz zvučnog zapisa 02" loading="lazy"></div>
<div class="item"><div class="item-top"><span class="number">03</span><button type="button" aria-label="Reproduciraj zapis 03" data-file="Cyrano_03.wav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg></button></div><img class="notation" src="Cyrano-03.png" alt="Vizualni prikaz zvučnog zapisa 03" loading="lazy"></div>
<div class="item"><div class="item-top"><span class="number">04</span><button type="button" aria-label="Reproduciraj zapis 04" data-file="Cyrano_04.wav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg></button></div><img class="notation" src="Cyrano-04.png" alt="Vizualni prikaz zvučnog zapisa 04" loading="lazy"></div>
<div class="item"><div class="item-top"><span class="number">05</span><button type="button" aria-label="Reproduciraj zapis 05" data-file="Cyrano_02.wav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg></button></div><img class="notation" src="Cyrano-05.png" alt="Vizualni prikaz zvučnog zapisa 05" loading="lazy"></div>
</section>
<footer></footer>
</main>
<script>
const audio=new Audio();let current=null;
const playIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg>';
const pauseIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>';
const buttons=[...document.querySelectorAll('button[data-file]')];
function reset(){buttons.forEach(b=>{b.innerHTML=playIcon;b.setAttribute('aria-label','Reproduciraj zapis '+b.closest('.item').querySelector('.number').textContent)});current=null}
buttons.forEach(b=>b.addEventListener('click',async()=>{
if(current===b&&!audio.paused){audio.pause();reset();return}
const file=b.dataset.file;
if(audio.getAttribute('data-file')!==file){audio.src=encodeURI(file);audio.setAttribute('data-file',file)}else{audio.currentTime=0}
reset();current=b;
try{await audio.play();b.innerHTML=pauseIcon;b.setAttribute('aria-label','Zaustavi zapis '+b.closest('.item').querySelector('.number').textContent)}catch(e){reset();alert('Zapis se nije mogao reproducirati. Provjerite je li datoteka učitana.')}
}));
audio.addEventListener('ended',reset);
</script>
</body>
</html>
